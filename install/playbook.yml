---
- name: Install dotfiles and their dependencies
  hosts: all
  # Everything the roles use (env, pkg_mgr, architecture, date_time) is in
  # the minimal subset; skip the slower hardware/network fact collection.
  gather_subset: ['!all']
  roles:
    # Always first: applies machine-specific environment values before the
    # dotfiles and dependency roles run (system-wide on Linux, user-level on macOS).
    - role: environment
      tags: [always, environment]
    - dotfiles
    - dependencies
