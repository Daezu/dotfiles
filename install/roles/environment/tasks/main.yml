---
- name: Check for a local environment vars file
  ansible.builtin.stat:
    path: "{{ environment_vars_file }}"
  delegate_to: localhost
  become: false
  register: environment_vars_file_stat

- name: Load local environment vars
  ansible.builtin.include_vars:
    file: "{{ environment_vars_file }}"
  when: environment_vars_file_stat.stat.exists

- name: Apply system environment variables on Linux
  ansible.builtin.import_tasks: linux.yml
  when: ansible_facts.system == 'Linux'

- name: Set custom environment variables for the macOS user's Zsh sessions
  ansible.builtin.import_tasks: macos.yml
  when: ansible_facts.system == 'Darwin'
