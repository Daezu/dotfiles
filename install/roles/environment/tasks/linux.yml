---
- name: Ensure custom environment variables are present in /etc/environment
  become: true
  ansible.builtin.lineinfile:
    path: /etc/environment
    create: true
    owner: root
    group: root
    mode: '0644'
    regexp: '^{{ item.key }}='
    line: '{{ item.key }}="{{ item.value }}"'
  loop: "{{ system_environment_vars | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: environment_vars_written

# /etc/environment is only read by PAM at login; drop the persistent SSH
# connection so the next task opens a fresh session with the new vars.
# Only needed when the file actually changed.
- name: Reconnect so the new /etc/environment is loaded by a fresh login session
  ansible.builtin.meta: reset_connection
  when: environment_vars_written is changed

- name: Refresh env facts from the new session
  ansible.builtin.setup:
    gather_subset: [env]
  when: environment_vars_written is changed
