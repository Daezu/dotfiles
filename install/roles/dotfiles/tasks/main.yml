---
# Links/copies this repo's dotfiles into $HOME. Any app folder under .config/,
# or any other top-level entry in this repo, is picked up automatically via
# the two `find` tasks below — adding a new app to the repo does not require
# touching this role.


- name: Determine whether this run is targeting a remote host over SSH
  ansible.builtin.set_fact:
    dotfiles_is_remote: "{{ ansible_connection != 'local' }}"

# maybe remove this if it works without
- name: Ensure .config directory exists in user's home
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.config"
    state: directory
    mode: '0755'

# Ship the repo as a single tarball rather than file-by-file copies, which
# cost one SSH round trip (plus checksum) per file.
- name: Stage this repo on the remote host (dotfiles_dir only exists on the controller)
  when: dotfiles_is_remote
  block:
    - name: Create a temp file for the repo tarball on the controller
      ansible.builtin.tempfile:
        suffix: .tar.gz
      delegate_to: localhost
      become: false
      register: dotfiles_tarball
      changed_when: false

    - name: Pack the repo on the controller
      ansible.builtin.command:
        argv: >-
          {{ ['tar', '-czf', dotfiles_tarball.path]
             + (dotfiles_stage_exclude | map('regex_replace', '^', '--exclude=') | list)
             + (dotfiles_exclude_names | reject('equalto', '.config')
                | map('regex_replace', '^', '--exclude=./') | list)
             + ['-C', dotfiles_dir, '.'] }}
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Ensure the staging directory exists
      ansible.builtin.file:
        path: "{{ dotfiles_stage_dir }}"
        state: directory
        mode: "0755"

    - name: Unpack the repo into the staging directory
      ansible.builtin.unarchive:
        src: "{{ dotfiles_tarball.path }}"
        dest: "{{ dotfiles_stage_dir }}"

    - name: Remove the tarball from the controller
      ansible.builtin.file:
        path: "{{ dotfiles_tarball.path }}"
        state: absent
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Use the staged copy as the dotfiles source for the rest of this run
      ansible.builtin.set_fact:
        dotfiles_dir: "{{ dotfiles_stage_dir }}"

- name: Discover top-level dotfiles repo entries
  ansible.builtin.find:
    paths: "{{ dotfiles_dir }}"
    file_type: any
    hidden: true
    recurse: false
  register: top_level_entries

- name: Discover .config app entries
  ansible.builtin.find:
    paths: "{{ dotfiles_dir }}/.config"
    file_type: any
    hidden: true
    recurse: false
  register: config_entries

- name: Build the placement list (top-level and CLI .config entries)
  ansible.builtin.set_fact:
    dotfiles_items: >-
      {%- set items = [] -%}
      {%- for f in top_level_entries.files if (f.path | basename) not in dotfiles_exclude_names -%}
      {%- set _ = items.append({'src': f.path, 'dest': ansible_facts.env.HOME ~ '/' ~ (f.path | basename)}) -%}
      {%- endfor -%}
      {%- for f in config_entries.files if (f.path | basename) not in dotfiles_gui_names -%}
      {%- set _ = items.append({'src': f.path, 'dest': ansible_facts.env.HOME ~ '/.config/' ~ (f.path | basename)}) -%}
      {%- endfor -%}
      {{ items }}

# Skipped unless install.sh --gui (which stops passing --skip-tags gui).
- name: Add GUI .config app entries to the placement list
  ansible.builtin.set_fact:
    dotfiles_items: >-
      {%- set items = [] -%}
      {%- for f in config_entries.files if (f.path | basename) in dotfiles_gui_names -%}
      {%- set _ = items.append({'src': f.path, 'dest': ansible_facts.env.HOME ~ '/.config/' ~ (f.path | basename)}) -%}
      {%- endfor -%}
      {{ dotfiles_items + items }}
  tags: [gui]

# One shell pass over all destinations instead of a stat + mv task per item.
- name: Back up destinations that exist and aren't already the correct link
  ansible.builtin.shell: |
    set -e
    while IFS=$'\t' read -r src dest; do
      [ -e "$dest" ] || [ -L "$dest" ] || continue
      if [ "{{ dotfiles_mode }}" = symlink ] && [ -L "$dest" ] && [ "$(readlink "$dest")" = "$src" ]; then
        continue
      fi
      rel="${dest#{{ ansible_facts.env.HOME }}/}"
      mkdir -p "{{ backup_dir }}/$(dirname "$rel")"
      mv "$dest" "{{ backup_dir }}/$rel"
      echo "backed up $dest"
    done
  args:
    executable: /bin/bash
    stdin: |
      {% for item in dotfiles_items %}
      {{ item.src }}	{{ item.dest }}
      {% endfor %}
  register: dotfiles_backup
  changed_when: dotfiles_backup.stdout != ''

- name: Ensure parent directories of each destination exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ dotfiles_items | map(attribute='dest') | map('dirname') | unique }}"

- name: Symlink dotfiles into place
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop: "{{ dotfiles_items }}"
  loop_control:
    label: "{{ item.dest }}"
  when: dotfiles_mode == 'symlink'

- name: Copy dotfiles into place
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    remote_src: true
    mode: preserve
  loop: "{{ dotfiles_items }}"
  loop_control:
    label: "{{ item.dest }}"
  when: dotfiles_mode == 'copy'

- name: Ensure ~/.zshenv exports ZDOTDIR (zsh needs this before it can find its own config)
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts.env.HOME }}/.zshenv"
    create: true
    line: 'export ZDOTDIR="{{ ansible_facts.env.HOME }}/.config/zsh"'
    regexp: '^export ZDOTDIR='
  when: (ansible_facts.env.HOME ~ '/.config/zsh') in (dotfiles_items | map(attribute='dest') | list)
