---
# aliases.zsh/prompt.zsh assume these are installed (e.g. `alias ls='eza --icons'`,
# `alias cat='bat'`, `eval "$(starship init zsh)"`); a bare devcontainer image
# has none of them. Installed via the system package manager where possible;
# tools not packaged for apt use release binaries in /usr/local/bin.
# All tasks here run with become, so shared executables remain root-owned.

- name: Ensure shared binary directory exists
  ansible.builtin.file:
    path: "{{ system_bin }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check if Starship is already available to the invoking user
  become: false
  ansible.builtin.shell: command -v starship
  args:
    executable: /bin/bash
  environment:
    PATH: "{{ ansible_facts.env.PATH }}"
  register: starship_probe
  changed_when: false
  failed_when: false

# One package-manager transaction for everything (package lists live in
# defaults/main.yml) instead of one per tool.
- name: Install packages - apt
  become: true
  ansible.builtin.apt:
    name: "{{ packages_common + packages_apt }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts.pkg_mgr == 'apt'

- name: Install packages - pacman
  become: true
  ansible.builtin.package:
    name: "{{ packages_common + packages_pacman }}"
    state: present
  when: ansible_facts.pkg_mgr == 'pacman'

- name: Install Starship with the package manager
  become: true
  ansible.builtin.package:
    name: starship
    state: present
  when:
    - ansible_facts.pkg_mgr in ['apt', 'pacman']
    - starship_probe.rc != 0
  register: starship_package_install
  ignore_errors: true

- name: Install Starship with the upstream installer if package install failed
  become: true
  ansible.builtin.shell: |
    set -o pipefail
    curl -sS https://starship.rs/install.sh | sh -s -- -y
  args:
    executable: /bin/bash
  when:
    - starship_probe.rc != 0
    - starship_package_install is failed

- name: Check installed shared Neovim version
  ansible.builtin.shell: |
    set -o pipefail
    if ! command -v nvim >/dev/null 2>&1; then
      exit 1
    fi
    nvim --version | sed -n '1s/^NVIM v//p'
  args:
    executable: /bin/bash
  environment:
    PATH: "{{ system_bin }}:/usr/bin:/bin"
  register: neovim_probe
  changed_when: false
  failed_when: false

- name: Mark Neovim for installation when it is missing
  ansible.builtin.set_fact:
    neovim_install_required: true
  when: neovim_probe.rc != 0

- name: Check whether installed Neovim meets the minimum version
  ansible.builtin.set_fact:
    neovim_install_required: >-
      {{ (neovim_probe.stdout | trim) is version(neovim_minimum_version, '<', version_type='semver') }}
  when: neovim_probe.rc == 0

- name: Install the latest stable Neovim when missing or too old
  when: neovim_install_required | bool
  block:
    - name: Fetch latest stable Neovim release metadata
      ansible.builtin.uri:
        url: https://api.github.com/repos/neovim/neovim/releases/latest
        headers:
          Accept: application/vnd.github+json
        return_content: true
        status_code: 200
        timeout: 60
      register: neovim_release
      changed_when: false
      until: neovim_release is succeeded
      retries: 3
      delay: 5

    - name: Record latest stable Neovim release version
      ansible.builtin.set_fact:
        neovim_release_version: "{{ neovim_release.json.tag_name | regex_replace('^v', '') }}"

    - name: Ensure latest stable Neovim meets the minimum version
      ansible.builtin.assert:
        that:
          - neovim_release_version is version(neovim_minimum_version, '>=', version_type='semver')
        fail_msg: >-
          Latest stable Neovim is {{ neovim_release_version }}, below the required
          {{ neovim_minimum_version }}.

    - name: Ensure Neovim release architecture is supported
      ansible.builtin.assert:
        that:
          - ansible_facts.architecture in neovim_arch_map
        fail_msg: "No Neovim release asset is configured for {{ ansible_facts.architecture }}."

    - name: Create a private Neovim release staging directory
      ansible.builtin.tempfile:
        state: directory
        prefix: dotfiles-neovim-
      register: neovim_stage

    - name: Download latest stable Neovim
      ansible.builtin.get_url:
        url: "https://github.com/neovim/neovim/releases/download/{{ neovim_release.json.tag_name }}/nvim-linux-{{ neovim_arch_map[ansible_facts.architecture] }}.tar.gz"
        dest: "{{ neovim_stage.path }}/nvim.tar.gz"
        mode: "0644"
        timeout: 60
      register: neovim_archive_download
      until: neovim_archive_download is succeeded
      retries: 3
      delay: 5

    - name: Create versioned Neovim installation directory
      ansible.builtin.file:
        path: "/opt/dotfiles-neovim-{{ neovim_release_version }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Extract Neovim release
      ansible.builtin.unarchive:
        src: "{{ neovim_stage.path }}/nvim.tar.gz"
        dest: "/opt/dotfiles-neovim-{{ neovim_release_version }}"
        remote_src: true
        extra_opts:
          - --strip-components=1
        creates: "/opt/dotfiles-neovim-{{ neovim_release_version }}/bin/nvim"

    - name: Point the shared Neovim command at the upstream release
      ansible.builtin.file:
        src: "/opt/dotfiles-neovim-{{ neovim_release_version }}/bin/nvim"
        dest: "{{ system_bin }}/nvim"
        state: link
        force: true
        owner: root
        group: root

    - name: Find previous dotfiles-managed Neovim releases
      ansible.builtin.find:
        paths: /opt
        patterns: dotfiles-neovim-*
        file_type: directory
      register: previous_neovim_releases

    - name: Remove previous dotfiles-managed Neovim releases
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ previous_neovim_releases.files }}"
      when: item.path != ('/opt/dotfiles-neovim-' ~ neovim_release_version)
  always:
    - name: Remove Neovim release staging directory
      ansible.builtin.file:
        path: "{{ neovim_stage.path }}"
        state: absent
      when: neovim_stage.path is defined

- name: Ensure XDG_CONFIG_HOME and ZDOTDIR block is present
  become: true
  ansible.builtin.blockinfile:
    path: /etc/zsh/zshenv
    create: true
    owner: root
    group: root
    mode: '0644'
    marker: "# {mark} ANSIBLE MANAGED BLOCK - ZDOTDIR"
    block: |
      if [[ -z "$XDG_CONFIG_HOME" ]]
      then
        export XDG_CONFIG_HOME="$HOME/.config"
      fi
      if [[ -d "$XDG_CONFIG_HOME/zsh" ]]
      then
        export ZDOTDIR="$XDG_CONFIG_HOME/zsh"
      fi

# One probe for every tool whose presence decides a fallback install below.
- name: Look up tools on PATH
  ansible.builtin.shell: |
    for t in bat batcat fd fdfind yazi tree-sitter uv devsy; do
      p=$(command -v "$t") && echo "$t=$p"
    done
    true
  args:
    executable: /bin/bash
  environment:
    PATH: "{{ system_bin }}:/usr/bin:/bin"
  register: tool_probe
  changed_when: false

- name: Record tool paths
  ansible.builtin.set_fact:
    tool_paths: >-
      {{ dict(tool_probe.stdout_lines | map('regex_replace', '=.*$', '')
              | zip(tool_probe.stdout_lines | map('regex_replace', '^[^=]*=', ''))) }}

# Debian/Ubuntu's `bat`/`fd-find` packages install the binaries as `batcat`/`fdfind`.
- name: Symlink batcat -> bat if needed
  ansible.builtin.file:
    src: "{{ tool_paths.batcat }}"
    dest: "{{ system_bin }}/bat"
    state: link
  when: "'bat' not in tool_paths and 'batcat' in tool_paths"

- name: Symlink fdfind -> fd if needed
  ansible.builtin.file:
    src: "{{ tool_paths.fdfind }}"
    dest: "{{ system_bin }}/fd"
    state: link
  when: "'fd' not in tool_paths and 'fdfind' in tool_paths"

# Probe only the shared PATH: a user's private binary must not skip system setup.
- name: Install missing shared release binaries
  when: >-
    'tree-sitter' not in tool_paths or 'yazi' not in tool_paths or
    'uv' not in tool_paths or 'devsy' not in tool_paths
  block:
    - name: Create a private release staging directory
      ansible.builtin.tempfile:
        state: directory
        prefix: dotfiles-tools-
      register: release_stage

    - name: Install Tree-sitter CLI
      when: "'tree-sitter' not in tool_paths"
      block:
        - name: Download Tree-sitter CLI
          ansible.builtin.get_url:
            url: "https://github.com/tree-sitter/tree-sitter/releases/latest/download/tree-sitter-linux-{{ tree_sitter_arch_map[ansible_facts.architecture] }}.gz"
            dest: "{{ release_stage.path }}/tree-sitter.gz"
            mode: "0644"
        - name: Unpack Tree-sitter CLI
          ansible.builtin.shell: >-
            gunzip -c "{{ release_stage.path }}/tree-sitter.gz" > "{{ release_stage.path }}/tree-sitter"
        - name: Install shared Tree-sitter CLI
          ansible.builtin.copy:
            src: "{{ release_stage.path }}/tree-sitter"
            dest: "{{ system_bin }}/tree-sitter"
            remote_src: true
            owner: root
            group: root
            mode: "0755"

    - name: Install Yazi
      when: "'yazi' not in tool_paths"
      block:
        - name: Download Yazi archive
          ansible.builtin.get_url:
            url: "https://github.com/sxyazi/yazi/releases/latest/download/yazi-{{ yazi_arch_map[ansible_facts.architecture] }}-unknown-linux-gnu.zip"
            dest: "{{ release_stage.path }}/yazi.zip"
            mode: "0644"
        - name: Extract Yazi archive
          ansible.builtin.unarchive:
            src: "{{ release_stage.path }}/yazi.zip"
            dest: "{{ release_stage.path }}"
            remote_src: true
        - name: Install shared Yazi binaries
          ansible.builtin.copy:
            src: "{{ release_stage.path }}/yazi-{{ yazi_arch_map[ansible_facts.architecture] }}-unknown-linux-gnu/{{ item }}"
            dest: "{{ system_bin }}/{{ item }}"
            remote_src: true
            owner: root
            group: root
            mode: "0755"
          loop: [yazi, ya]

    - name: Install uv
      when: "'uv' not in tool_paths"
      block:
        - name: Download uv archive
          ansible.builtin.get_url:
            url: "https://github.com/astral-sh/uv/releases/latest/download/uv-{{ uv_arch_map[ansible_facts.architecture] }}-unknown-linux-gnu.tar.gz"
            dest: "{{ release_stage.path }}/uv.tar.gz"
            mode: "0644"
        - name: Extract uv archive
          ansible.builtin.unarchive:
            src: "{{ release_stage.path }}/uv.tar.gz"
            dest: "{{ release_stage.path }}"
            remote_src: true
        - name: Install shared uv binaries
          ansible.builtin.copy:
            src: "{{ release_stage.path }}/uv-{{ uv_arch_map[ansible_facts.architecture] }}-unknown-linux-gnu/{{ item }}"
            dest: "{{ system_bin }}/{{ item }}"
            remote_src: true
            owner: root
            group: root
            mode: "0755"
          loop: [uv, uvx]

    - name: Install shared Devsy binary
      ansible.builtin.get_url:
        url: "https://github.com/devsy-org/devsy/releases/latest/download/devsy-linux-{{ devsy_arch_map[ansible_facts.architecture] }}"
        dest: "{{ system_bin }}/devsy"
        owner: root
        group: root
        mode: "0755"
      when: "'devsy' not in tool_paths"
  always:
    - name: Remove release staging directory
      ansible.builtin.file:
        path: "{{ release_stage.path }}"
        state: absent
      when: release_stage.path is defined
