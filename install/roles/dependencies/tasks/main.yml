---
- name: Ensure target operating system is supported
  ansible.builtin.assert:
    that: ansible_facts.system in ['Linux', 'Darwin']
    fail_msg: "This installer supports Linux and macOS, not {{ ansible_facts.system }}."

- name: Install Linux system tools
  ansible.builtin.import_tasks: packages.yml
  when:
    - not skip_packages
    - ansible_facts.system == 'Linux'
  become: true

- name: Install macOS tools
  ansible.builtin.import_tasks: macos.yml
  when:
    - not skip_packages
    - ansible_facts.system == 'Darwin'
  become: false

- name: Set up per-user language environments
  ansible.builtin.import_tasks: user.yml
  become: false

- name: Prefetch per-user zsh plugins
  ansible.builtin.import_tasks: plugins.yml
  become: false
