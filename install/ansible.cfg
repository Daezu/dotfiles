[defaults]
roles_path = ./roles
host_key_checking = False
interpreter_python = auto_silent
# Per-task timing summary at the end of each run
callbacks_enabled = ansible.posix.profile_tasks

[ssh_connection]
# Run modules over the existing SSH session instead of copying a temp file
# per task; roughly halves the round trips for remote installs.
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
