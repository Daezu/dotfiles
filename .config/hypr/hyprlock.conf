# Time
label {
    monitor = DP-2
    #text = cmd[update:1000] echo "<b><big> $(date +"%I:%M:%S %p") </big></b>" # AM/PM
    text = cmd[update:1000] echo "<b><big> $(date +"%H:%M:%S") </big></b>" # 24H
    color = $on_surface
    font_size = 94
    font_family = Noto Sans 10

    position = 0, 0
    halign = center
    valign = center
}

# User
label {
    monitor = DP-2
    text =    $USER
    color = $on_surface
    font_size = 18
    font_family = Inter Display Medium

    position = 0, 100
    halign = center
    valign = bottom
}

